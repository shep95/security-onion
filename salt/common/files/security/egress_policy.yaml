# Theory 2: outbound intel API allowlist for Sensoroni analyzers.
enabled: true
default_timeout_seconds: 30
max_artifact_bytes: 65536
max_value_length: 4096
block_private_targets: true
allowed_schemes:
  - https
allowed_host_suffixes:
  - virustotal.com
  - alienvault.com
  - greynoise.io
  - urlscan.io
  - emailrep.io
  - abuse.ch
  - pulsedive.com
  - cymru.com
  - spamhaus.org
